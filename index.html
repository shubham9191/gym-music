<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GYM MUSIC</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <header class="navbar">

    <div class="logo">
      🏋️ GYM MUSIC
    </div>


    <nav>

      <a href="#player">
        Player
      </a>

    </nav>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- HERO -->

    <section class="hero">

      <img
        src="gym-hero.png"
        class="hero-image"
        alt="GYM MUSIC"
      >


      <div class="hero-overlay"></div>


      <div class="hero-content">

        <div class="badge">
          WORKOUT • MUSIC • ENERGY
        </div>


        <h1>
          GYM<br>
          <span>MUSIC</span>
        </h1>


        <p>
          Pump up your workout.
          Unleash your potential.
        </p>


        <button
          class="listen-btn"
          id="heroPlay"
        >

          ▶ Listen Now

        </button>

      </div>

    </section>



    <!-- =========================
         MUSIC PLAYER
    ========================== -->

    <section
      id="player"
      class="player-section"
    >


      <div class="section-heading">

        <span class="eyebrow">
          GYM PLAYER
        </span>


        <h2>
          Train. Play. Repeat.
        </h2>

      </div>



      <div class="player-card">


        <!-- YouTube Music Player -->

        <div class="youtube-box">

          <div id="youtube-player"></div>

        </div>



        <!-- PLAYER CONTROLS -->

        <div class="music-controls">


          <div class="now-playing">

            <span class="eyebrow">
              NOW PLAYING
            </span>


            <h3 id="songTitle">
              GYM MUSIC
            </h3>


            <div
              id="status"
              class="status"
            >
              LOADING
            </div>

          </div>



          <!-- CONTROL BUTTONS -->

          <div class="buttons">


            <button
              id="prevBtn"
              class="control"
              title="Previous Song"
            >

              ⏮

            </button>



            <button
              id="playBtn"
              class="control play"
              title="Play / Pause"
            >

              ▶

            </button>



            <button
              id="nextBtn"
              class="control"
              title="Next Song"
            >

              ⏭

            </button>

          </div>



          <!-- PROGRESS -->

          <div class="progress">


            <span id="currentTime">
              0:00
            </span>


            <input
              id="seek"
              type="range"
              min="0"
              max="100"
              value="0"
            >


            <span id="duration">
              0:00
            </span>

          </div>



          <!-- VOLUME -->

          <div class="volume">

            <span>
              🔊
            </span>


            <input
              id="volume"
              type="range"
              min="0"
              max="100"
              value="80"
            >

          </div>


        </div>

      </div>

    </section>


  </main>



  <!-- FOOTER -->

  <footer>

    GYM MUSIC • Built for your next PR

  </footer>



  <!-- YOUTUBE API -->

  <script
    src="https://www.youtube.com/iframe_api"
  ></script>


  <!-- YOUR JAVASCRIPT -->

  <script src="app.js"></script>


</body>

</html>
