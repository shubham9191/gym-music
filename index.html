<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYM MUSIC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

  <div class="logo">
    🏋️ GYM MUSIC
  </div>

  <nav>
    <a href="#player">Player</a>
    <a href="#playlist">Playlist</a>
  </nav>

</header>


<main>

  <!-- HERO -->

  <section class="hero">

    <img
      src="gym-hero.png"
      class="hero-image"
      alt="Gym Music"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <div class="badge">
        WORKOUT • MUSIC • ENERGY
      </div>

      <h1>
        ULTIMATE<br>
        <span>GYM MUSIC</span>
      </h1>

      <p>
        Pump up your workout. Unleash your potential.
      </p>

      <button
        class="listen-btn"
        id="heroPlay"
      >
        ▶ Listen Now
      </button>

    </div>

  </section>


  <!-- PLAYER -->

  <section
    id="player"
    class="player-section"
  >

    <div class="section-heading">

      <div>

        <span class="eyebrow">
          GYM PLAYER
        </span>

        <h2>
          Train. Play. Repeat.
        </h2>

      </div>

    </div>


    <div class="player-card">


      <!-- YouTube Player -->

      <div class="youtube-box">

        <div id="youtube-player"></div>

      </div>


      <!-- Custom Controls -->

      <div class="music-controls">

        <div class="now-playing">

          <span class="eyebrow">
            NOW PLAYING
          </span>

          <h3 id="songTitle">
            GYM MUSIC
          </h3>

          <div
            id="status"
            class="status"
          >
            LOADING
          </div>

        </div>


        <div class="buttons">

          <button
            id="prevBtn"
            class="control"
          >
            ⏮
          </button>


          <button
            id="playBtn"
            class="control play"
          >
            ▶
          </button>


          <button
            id="nextBtn"
            class="control"
          >
            ⏭
          </button>

        </div>


        <div class="progress">

          <span id="currentTime">
            0:00
          </span>

          <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
          >

          <span id="duration">
            0:00
          </span>

        </div>


        <div class="volume">

          <span>
            🔊
          </span>

          <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="80"
          >

        </div>

      </div>

    </div>

  </section>


  <!-- PLAYLIST -->

  <section
    id="playlist"
    class="playlist-section"
  >

    <div class="section-heading playlist-heading">

      <div>

        <span class="eyebrow">
          BEAST PLAYLIST
        </span>

        <h2>
          Your Workout Playlist
        </h2>

      </div>


      <input
        id="search"
        class="search"
        type="text"
        placeholder="Search songs..."
      >

    </div>


    <div
      id="playlistList"
      class="playlist-list"
    >

      <div class="loading">
        Loading playlist...
      </div>

    </div>

  </section>

</main>


<footer>
  GYM MUSIC • Built for your next PR
</footer>


<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>

</body>
</html>
